<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eco Track</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="images/Glossy Gold and Chrome ET Monogram.png">
</head>
<body>

  <button class="menu-btn" id="toggle">☰</button>

  <aside id="sidebar">
    <nav class="navigation">
      <ul>
        <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="currencies.html"><i class="fa-solid fa-coins"></i> Currencies</a></li>
        <li><a href="gold.html"><i class="fa-solid fa-ring"></i> Gold</a></li>
        <li><a href="bars.html"><i class="fa-solid fa-cubes"></i> Bars</a></li>
        <li><a href="silver.html" class="active"><i class="fa-solid fa-gem"></i> Silver</a></li>
        <li><a href="calculator.html" class="active"><i class="fa-solid fa-calculator"></i> Calculator</a></li>
        
      </ul>
    </nav>
  </aside>
  <div class="overlay" id="overlay"></div>

  <header>
    <a class="logo" href="index.html"><img src="images/Glossy Gold and Chrome ET Monogram.png" alt="Logo"></a>
  </header>

  <main class="page">
    <h1>الحاسبة</h1>

    <div class="calc-box">
      <h2>تحويل العملات</h2>
      <div class="calc-row">
        <input type="number" id="amount" placeholder="المبلغ" value="100" min="0">
        <select id="from"></select>
        <select id="to"></select>
      </div>
      <button class="calc-btn" id="convert-btn">حوّل</button>
      <div class="result" id="currency-result"></div>
    </div>

    <div class="calc-box">
      <h2>حاسبة الذهب</h2>
      <div class="calc-row">
        <input type="number" id="grams" placeholder="الوزن بالجرام" value="10" min="0" step="0.1">
        <select id="karat">
          <option value="24">عيار 24</option>
          <option value="21" selected>عيار 21</option>
          <option value="18">عيار 18</option>
        </select>
      </div>
      <button class="calc-btn" id="gold-btn">احسب</button>
      <div class="result" id="gold-result"></div>
    </div>
  </main>

  <script src="js/script.js"></script>
  <script src="prices.js"></script>
  <script src="rates.js"></script>
  <script src="calculator.js"></script>
</body>
</html>
